<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Fynn Tabs</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header -->
  <header class="popup-header">
    <div class="brand">
      <div id="brand-logo" aria-hidden="true"></div>
      <div class="brand-title">
        Fynn Tabs <span class="version">v0.1</span>
      </div>
    </div>
    <div class="row">
      <button id="open-manager" class="icon-btn" title="Mở trang Quản lý đầy đủ" aria-label="Mở trang Quản lý đầy đủ">
        <span id="manager-icon"></span>
      </button>
    </div>
  </header>

  <!-- Segmented Navigation -->
  <nav class="nav-tabs" role="tablist" aria-label="Các chế độ quản lý">
    <button class="nav-tab active" data-view="view-tabs" role="tab" id="tab-btn-tabs" aria-selected="true" aria-controls="view-tabs">
      <span id="tab-icon"></span>
      <span>Đang mở</span>
      <span id="badge-tabs" class="badge accent">0</span>
    </button>
    <button class="nav-tab" data-view="view-workspaces" role="tab" id="tab-btn-workspaces" aria-selected="false" aria-controls="view-workspaces">
      <span id="workspace-icon"></span>
      <span>Workspace</span>
      <span id="badge-workspaces" class="badge">0</span>
    </button>
    <button class="nav-tab" data-view="view-sessions" role="tab" id="tab-btn-sessions" aria-selected="false" aria-controls="view-sessions">
      <span id="session-icon"></span>
      <span>Session</span>
      <span id="badge-sessions" class="badge">0</span>
    </button>
  </nav>

  <!-- View 1: Tabs đang mở -->
  <section id="view-tabs" class="tab-view active" role="tabpanel" aria-labelledby="tab-btn-tabs">
    <div class="search-wrapper">
      <span class="search-icon" id="search-icon"></span>
      <input id="q" placeholder="Tìm kiếm tab theo tiêu đề hoặc URL…" autofocus aria-label="Tìm kiếm tab">
      <button id="q-clear" class="clear-btn" title="Xóa tìm kiếm" aria-label="Xóa tìm kiếm">✕</button>
    </div>

    <div id="tabs" class="item-list scroll-list"></div>

    <div class="action-bar-footer">
      <button id="btn-quick-session">
        <span id="save-session-icon"></span> Lưu Session
      </button>
      <button id="btn-quick-workspace">
        <span id="save-workspace-icon"></span> Lưu Workspace
      </button>
    </div>
  </section>

  <!-- View 2: Workspaces -->
  <section id="view-workspaces" class="tab-view" role="tabpanel" aria-labelledby="tab-btn-workspaces">
    <div class="action-bar">
      <input id="wname" placeholder="Tên workspace từ tab hiện tại…" aria-label="Tên workspace từ tab hiện tại">
      <button id="wsave" class="primary">Lưu</button>
    </div>
    <div id="workspaces" class="item-list scroll-list"></div>
  </section>

  <!-- View 3: Sessions -->
  <section id="view-sessions" class="tab-view" role="tabpanel" aria-labelledby="tab-btn-sessions">
    <div class="action-bar">
      <input id="name" placeholder="Tên session từ tab hiện tại…" aria-label="Tên session từ tab hiện tại">
      <button id="save" class="primary">Lưu</button>
    </div>
    <div id="sessions" class="item-list scroll-list"></div>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>

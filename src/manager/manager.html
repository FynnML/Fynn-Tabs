<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Fynn Tabs — Trình Quản Lý</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="manager.css">
</head>
<body>
  <main>
    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <div id="brand-logo" aria-hidden="true"></div>
        <div>
          <h1>Fynn Tabs</h1>
          <p>Quản lý và sao lưu Workspaces, Sessions trình duyệt</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="export" title="Xuất toàn bộ dữ liệu ra tệp JSON" aria-label="Xuất JSON">
          <span id="export-icon" aria-hidden="true"></span> Xuất JSON
        </button>
        <button id="import" title="Nhập dữ liệu từ tệp JSON sao lưu" aria-label="Nhập JSON">
          <span id="import-icon" aria-hidden="true"></span> Nhập JSON
        </button>
        <input id="file" type="file" accept="application/json,.json" hidden aria-label="Tệp sao lưu JSON">
      </div>
    </header>

    <!-- Stats Overview -->
    <section class="stats-grid" aria-label="Thống kê tổng quan">
      <div class="stat-card">
        <div class="stat-icon" id="stat-icon-ws" aria-hidden="true"></div>
        <div class="stat-info">
          <span id="stat-ws-count" class="stat-value">0</span>
          <span class="stat-label">Workspaces đã lưu</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" id="stat-icon-sess" aria-hidden="true"></div>
        <div class="stat-info">
          <span id="stat-sess-count" class="stat-value">0</span>
          <span class="stat-label">Sessions đã lưu</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" id="stat-icon-urls" aria-hidden="true"></div>
        <div class="stat-info">
          <span id="stat-url-count" class="stat-value">0</span>
          <span class="stat-label">Tổng liên kết URL lưu trữ</span>
        </div>
      </div>
    </section>

    <!-- Toolbar: Search & Filters -->
    <div class="manager-toolbar" role="toolbar" aria-label="Tìm kiếm và bộ lọc">
      <div class="search-wrapper">
        <span class="search-icon" id="search-icon" aria-hidden="true"></span>
        <input id="search" placeholder="Tìm theo tên workspace, session, tiêu đề trang hoặc URL…" aria-label="Tìm kiếm workspace, session hoặc URL">
        <button id="search-clear" class="clear-btn" title="Xóa tìm kiếm" aria-label="Xóa tìm kiếm">✕</button>
      </div>
      <div class="filter-pills" role="group" aria-label="Bộ lọc loại mục">
        <button class="filter-pill active" data-filter="all" aria-pressed="true">Tất cả</button>
        <button class="filter-pill" data-filter="workspaces" aria-pressed="false">Workspaces</button>
        <button class="filter-pill" data-filter="sessions" aria-pressed="false">Sessions</button>
      </div>
    </div>

    <!-- Section Workspaces -->
    <section id="section-workspaces" aria-labelledby="ws-title-heading">
      <div class="section-header">
        <div class="section-title" id="ws-title-heading">
          <span id="ws-sec-icon" aria-hidden="true"></span>
          <span>Workspaces</span>
          <span id="ws-badge" class="badge accent">0</span>
        </div>
      </div>

      <div class="section-create-bar">
        <input id="wname" placeholder="Nhập tên workspace mới…" aria-label="Tên workspace mới">
        <button id="wnew" class="primary">Tạo mới</button>
        <button id="wcur">Lưu từ các tab hiện tại</button>
      </div>

      <div id="workspaces"></div>
    </section>

    <!-- Section Sessions -->
    <section id="section-sessions" aria-labelledby="sess-title-heading">
      <div class="section-header">
        <div class="section-title" id="sess-title-heading">
          <span id="sess-sec-icon" aria-hidden="true"></span>
          <span>Sessions</span>
          <span id="sess-badge" class="badge">0</span>
        </div>
      </div>

      <div id="sessions"></div>
    </section>
  </main>

  <script type="module" src="manager.js"></script>
</body>
</html>
